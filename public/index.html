<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>Guía del Cazador</title>
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="barra">
  <div class="barra-fila">
    <div class="marca">
      <img src="icono.svg" alt="" width="30" height="30">
      <span>Guía del Cazador</span>
    </div>
    <nav class="acciones" aria-label="Menú">
      <button class="icono" id="btn-nuevo" title="Nueva conversación" aria-label="Nueva conversación">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icono" id="btn-historial" title="Historial" aria-label="Historial">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
      </button>
      <button class="icono" id="btn-favoritos" title="Favoritos" aria-label="Favoritos">
        <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>
      </button>
      <button class="icono" id="btn-tema" title="Modo oscuro / claro" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icono" id="btn-ajustes" title="Ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </nav>
  </div>

  <div class="barra-fila juego-fila">
    <div class="segmento" role="radiogroup" aria-label="Juego" id="selector-juego"></div>
    <label class="interruptor" id="caja-expansion" hidden>
      <input type="checkbox" id="chk-expansion">
      <span class="pista"></span>
      <span>Tengo <b id="nombre-expansion">Iceborne</b></span>
    </label>
  </div>

  <div class="barra-fila contexto-fila">
    <span class="jugando" id="jugando"></span>
    <div class="chips" id="chips-contexto"></div>
  </div>
</header>

<div id="aviso-servidor" class="aviso" hidden></div>

<main id="chat" aria-live="polite"></main>

<form class="redactor" id="form-pregunta" autocomplete="off">
  <div class="redactor-caja">
    <textarea id="pregunta" rows="1" maxlength="500" placeholder="Escribe tu duda… (ej.: ¿dónde consigo Gema de wyvern?)" aria-label="Tu pregunta"></textarea>
    <button type="submit" class="enviar" id="btn-enviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <p class="nota-pie">Las respuestas se basan en búsquedas reales; revisa las fuentes. No afiliado a Capcom.</p>
</form>

<!-- Panel lateral: historial, favoritos, ajustes, contexto -->
<div class="velo" id="velo" hidden></div>
<aside class="panel" id="panel" aria-hidden="true" role="dialog" aria-labelledby="panel-titulo">
  <div class="panel-cabeza">
    <h2 id="panel-titulo"></h2>
    <button class="icono" id="btn-cerrar-panel" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="panel-cuerpo" id="panel-cuerpo"></div>
</aside>

<script src="config.js"></script>
<script src="juegos.js"></script>
<script src="app.js"></script>
</body>
</html>
